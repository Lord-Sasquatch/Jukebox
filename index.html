<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>Jukebox</title>
<style>
:root{
  --gold:#d3a44b;--gold2:#f2c96b;--cream:#efe6d2;--muted:#a99570;
  --line:#75551d;--barH:72px;--headH:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--cream);
font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at 50% -15%,rgba(125,81,20,.15),transparent 36%),linear-gradient(180deg,#0a0908,#020202)}
button,input,select{font:inherit}button{cursor:pointer}
.app{height:100svh;min-height:100svh;padding:6px 10px calc(var(--barH) + 14px);position:relative}
header{height:var(--headH);display:grid;grid-template-columns:100px 1fr 130px;align-items:center}
.menu{border:0;background:none;color:var(--gold2);font-size:24px;text-align:left}
.logo{text-align:center;line-height:1}.logo .title{font-family:Georgia,serif;font-weight:900;font-size:34px;letter-spacing:2px;color:var(--gold2)}
.logo .tag{font-size:10px;letter-spacing:3px;color:#cc8b25;font-style:italic;margin-top:2px}
.status{justify-self:end;color:var(--gold2);font-size:10px;white-space:nowrap}
.content{height:calc(100% - var(--headH));min-height:0;overflow:hidden}
.screen{display:none;height:100%;min-height:0}.screen.active{display:block}
.homewrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
.section-title{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--gold2);letter-spacing:2px;font-size:13px;font-weight:700}
.section-title:before,.section-title:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:1;max-width:150px}
.grid{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px}
.card{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:#111;color:inherit;padding:0;text-align:left}
.card .art{position:absolute;inset:0;background-size:cover;background-position:center}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(0,0,0,.9))}
.card .word{position:absolute;inset:0 0 24% 0;display:grid;place-items:center;text-align:center;padding:6px;
font-family:Georgia,serif;font-size:clamp(14px,2.2vw,25px);font-weight:900;color:#d8b05e;text-shadow:0 2px 10px #000}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:5px 7px}.card .meta b,.card .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta b{font-size:12px}.card .meta span{color:var(--gold2);font-size:9px;margin-top:1px}
.quick-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.quick{height:38px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(180deg,#11100e,#080808);color:var(--cream);display:flex;align-items:center;justify-content:center;gap:7px}
.quick .ico{font-size:19px;color:var(--gold2)}.quick strong{display:block;font-size:11px}.quick small{display:none}
.nowbar{position:fixed;z-index:10;left:10px;right:10px;bottom:max(6px,env(safe-area-inset-bottom));height:var(--barH);
border:1px solid var(--gold);border-radius:8px;background:linear-gradient(180deg,#100d08,#050505);
display:grid;grid-template-columns:54px minmax(130px,1fr) auto minmax(115px,160px);align-items:center;gap:8px;padding:6px 8px;
box-shadow:0 0 14px rgba(211,164,75,.13)}
.albumthumb{width:52px;height:52px;border:1px solid var(--line);border-radius:4px;background:#19130b center/cover no-repeat}
.track{min-width:0}.track b,.track span,.track small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track b{font-size:15px}.track span{color:var(--gold2);font-size:11px}.track small{color:var(--muted);font-size:9px}
.playerbuttons{display:flex;align-items:center;gap:7px}.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:#0b0b0b;color:var(--gold2)}
.round.main{width:42px;height:42px;font-size:18px}.volbox{display:flex;align-items:center;gap:6px;color:var(--gold2);font-size:10px}.volbox input{min-width:0;width:100%;accent-color:var(--gold)}
.subscreen{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}.subhead{display:flex;align-items:center;justify-content:space-between}.subhead h2{margin:0;color:var(--gold2);letter-spacing:2px;font-size:20px}
.back{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#0b0b0b;color:var(--gold2)}
.list{min-height:0;overflow:auto;border:1px solid #261d10;border-radius:7px;background:rgba(10,10,10,.68)}
.row{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) 58px;align-items:center;gap:8px;min-height:54px;padding:4px 8px;border:0;border-bottom:1px solid #211d16;background:transparent;color:inherit;text-align:left}
.row img{width:42px;height:42px;object-fit:cover;border:1px solid var(--line)}.song{min-width:0}.song b,.song span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song b{font-size:13px}.song span{color:var(--gold2);font-size:10px}.dur{color:var(--muted);text-align:right;font-size:10px}
.searcharea{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}.searchinput{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#0d0d0d;color:var(--cream);outline:none;font-size:15px}
.player-screen{height:100%;display:grid;grid-template-columns:minmax(220px,40%) minmax(0,60%);gap:12px;padding:0 4px}.cover{min-height:0;border:1px solid var(--line);border-radius:8px;background:#15100a center/contain no-repeat}.details{display:flex;flex-direction:column;justify-content:center;min-height:0}
.details h1{font-size:30px;margin:7px 0 3px}.details h2{font-size:19px;color:var(--gold2);margin:0 0 3px}.details p{color:var(--muted);margin:0 0 5px;font-size:13px}.seek input{width:100%;accent-color:var(--gold)}.times{display:flex;justify-content:space-between;font-size:10px}
.bigcontrols{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:5px}.utility{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.utility button{height:34px;background:#0b0b0b;border:1px solid var(--line);color:var(--gold2);border-radius:6px;font-size:11px}
.drawer{position:fixed;top:0;left:-310px;width:300px;height:100svh;background:#090909;border-right:1px solid var(--gold);z-index:30;padding:16px;transition:left .2s;box-shadow:8px 0 24px rgba(0,0,0,.5)}
.drawer.open{left:0}.drawer h2{color:var(--gold2);margin:5px 0 15px}.drawer button,.drawer select{width:100%;height:42px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:#12100c;color:var(--cream);padding:0 9px}.drawer small{display:block;color:var(--muted);line-height:1.35;margin:6px 0 12px;font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29;display:none}.overlay.show{display:block}
.msg{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);padding:7px 11px;border:1px solid var(--gold);background:#16110a;border-radius:6px;opacity:0;pointer-events:none;transition:.18s;z-index:40;font-size:11px;max-width:80%;text-align:center}.msg.show{opacity:1}


.status{display:flex;justify-content:flex-end;align-items:center;gap:10px}
#clock{font-size:13px;color:var(--gold2);font-weight:700}
#queueCount{font-size:9px;color:var(--muted);letter-spacing:1px}
.nowbar{position:fixed}
.nowprogress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#20180d;overflow:hidden;border-radius:0 0 8px 8px}
.nowprogress i{display:block;height:100%;width:0;background:var(--gold2);box-shadow:0 0 8px rgba(242,201,107,.45);transition:width .35s linear}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:#0d0d0d}
.mosaic img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.08) brightness(.72)}
.mosaic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.38) 55%,rgba(0,0,0,.88))}
.mosaic-fallback{position:absolute;inset:0;background:
  radial-gradient(circle at 32% 28%,rgba(211,164,75,.17),transparent 24%),
  radial-gradient(circle at 70% 68%,rgba(102,38,25,.24),transparent 30%),
  linear-gradient(135deg,#18130c,#050505 68%,#22140a)}
.card .meta{z-index:3}
.settings-panel{display:none;padding-top:2px;border-top:1px solid #2d2418;margin-top:3px}
.settings-panel.open{display:block}
.trackpick-actions .primary{background:linear-gradient(180deg,#3a2a10,#211507);box-shadow:0 0 14px rgba(211,164,75,.18);font-size:16px}
.dim-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;z-index:45;transition:opacity .5s}
.dim-overlay.on{opacity:1}

.trackpick-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.trackpick-overlay.show{display:flex}
.trackpick{width:min(520px,92vw);border:1px solid var(--gold);border-radius:12px;background:linear-gradient(180deg,#14110c,#070707);box-shadow:0 16px 50px rgba(0,0,0,.7);padding:16px}
.trackpick-head{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:14px}
.trackpick-art{width:72px;height:72px;border:1px solid var(--line);border-radius:6px;background:#17120b center/cover no-repeat}
.trackpick-info{min-width:0}.trackpick-info b,.trackpick-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackpick-info b{font-size:20px}.trackpick-info span{color:var(--gold2);font-size:13px;margin-top:4px}
.trackpick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trackpick-actions button{height:50px;border:1px solid var(--gold);border-radius:8px;background:#12100c;color:var(--gold2);font-weight:700}
.trackpick-actions .queue-action{background:#20170a}
.trackpick-cancel{width:100%;height:40px;margin-top:9px;border:1px solid #44351f;border-radius:7px;background:#090909;color:var(--muted)}
.result-count{color:var(--muted);font-size:10px;margin-left:8px}

@media (max-height:500px){
  :root{--barH:64px;--headH:46px}
  .logo .title{font-size:27px}.logo .tag{display:none}.status{font-size:9px}
  .quick{height:32px}.section-title{font-size:11px}
  .card .meta b{font-size:10px}.card .meta span{font-size:8px}.card .word{font-size:16px}
  .albumthumb{width:46px;height:46px}.nowbar{grid-template-columns:48px minmax(110px,1fr) auto minmax(100px,130px)}
}
</style>
</head>
<body>
<div class="app">
<header>
<button class="menu" id="menuBtn">☰</button>
<div class="logo"><div class="title">JUKEBOX</div><div class="tag">PLAY IT LOUD</div></div>
<div class="status"><div id="clock">--:--</div><div id="queueCount">QUEUE 0</div></div>
</header>

<div class="content">
<section id="home" class="screen active">
<div class="homewrap">
<div class="section-title">BROWSE</div>
<div class="grid" id="browseGrid"></div>
<div class="quick-actions">
<button class="quick" data-screen="search"><div class="ico">⌕</div><div><strong>SEARCH</strong><small>Find music</small></div></button>
<button class="quick" id="favouritesBtn"><div class="ico">★</div><div><strong>FAVOURITES</strong><small>Liked tracks</small></div></button>
<button class="quick" id="recentBtn"><div class="ico">↺</div><div><strong>RECENT</strong><small>Recently played</small></div></button>
</div>
</div>
</section>

<section id="results" class="screen"><div class="subscreen">
<div class="subhead"><button class="back" data-screen="home">‹ BACK</button><h2 id="resultsTitle">RESULTS</h2><span></span></div>
<div class="list" id="resultsList"></div>
</div></section>

<section id="search" class="screen"><div class="subscreen">
<div class="subhead"><button class="back" data-screen="home">‹ BACK</button><h2>SEARCH</h2><span></span></div>
<div class="searcharea"><input id="searchInput" class="searchinput" placeholder="Search tracks or artists…"><div class="list" id="searchResults"></div></div>
</div></section>

<section id="queue" class="screen"><div class="subscreen">
<div class="subhead"><button class="back" data-screen="player">‹ BACK</button><h2>QUEUE</h2><span></span></div>
<div class="list" id="queueList"></div>
</div></section>

<section id="player" class="screen">
<div class="player-screen">
<div class="cover" id="cover"></div>
<div class="details">
<button class="back" data-screen="home">‹ BACK</button>
<h1 id="playerTitle">Nothing playing</h1><h2 id="playerArtist">Spotify</h2><p id="playerAlbum">—</p>
<div class="seek"><div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div><input id="seekSlider" type="range" min="0" max="1000" value="0"></div>
<div class="bigcontrols"><button class="round" data-cmd="prev">◀</button><button class="round main" id="bigPlay">▶</button><button class="round" data-cmd="next">▶</button></div>
<div class="utility"><button id="queueBtn">QUEUE</button><button id="shuffleBtn">SHUFFLE</button><button id="repeatBtn">REPEAT</button><button id="refreshPlayer">REFRESH</button></div>
</div>
</div>
</section>
</div>
</div>

<footer class="nowbar" id="nowbar"><div class="nowprogress"><i id="nowProgress"></i></div>
<div class="albumthumb" id="miniArt"></div>
<div class="track"><b id="miniTitle">Nothing playing</b><span id="miniArtist">Spotify</span><small id="miniAlbum">—</small></div>
<div class="playerbuttons"><button class="round" data-cmd="prev">◀</button><button class="round main" id="miniPlay">▶</button><button class="round" data-cmd="next">▶</button></div>
<div class="volbox"><span>🔊</span><input id="volumeSlider" type="range" min="0" max="100" value="65"><span id="volText">65%</span></div>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
<h2>JUKEBOX</h2>
<button id="drawerHome">HOME</button>
<button id="drawerNow">NOW PLAYING</button>
<button id="drawerQueue">QUEUE</button>
<button id="settingsToggle">SETTINGS ▾</button>
<div id="settingsPanel" class="settings-panel">
  <button id="fullScreenBtn">FULLSCREEN NOW</button>
  <button id="installBtn" style="display:none">INSTALL JUKEBOX APP</button>
  <label>Playback device</label>
  <select id="deviceSelect"><option value="">Loading devices…</option></select>
  <button id="reloadDevices">REFRESH DEVICES</button>
  <button id="logoutBtn">DISCONNECT SPOTIFY</button>
  <small>For the PRITOM to appear as a Spotify playback device, open Spotify on the tablet and start a track once, then return here and refresh devices.</small>
</div>
</aside>
<div class="msg" id="msg"></div>
<div id="dimOverlay" class="dim-overlay"></div>

<div class="trackpick-overlay" id="trackPickOverlay">
  <div class="trackpick">
    <div class="trackpick-head">
      <div class="trackpick-art" id="trackPickArt"></div>
      <div class="trackpick-info"><b id="trackPickTitle">Track</b><span id="trackPickArtist">Artist</span></div>
    </div>
    <div class="trackpick-actions">
      <button class="queue-action primary" id="addQueueBtn">＋ ADD TO QUEUE</button>
      <button id="playNowBtn">▶ PLAY NOW</button>
    </div>
    <button class="trackpick-cancel" id="trackPickCancel">CANCEL</button>
  </div>
</div>


<script>
const API='https://api.spotify.com/v1';
const $=id=>document.getElementById(id);
const screens=[...document.querySelectorAll('.screen')];

function showScreen(id){screens.forEach(s=>s.classList.toggle('active',s.id===id))}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));
$('nowbar').onclick=e=>{if(!e.target.closest('button')&&!e.target.closest('input'))showScreen('player')};

function friendly(t){
 const s=String(t||'');
 if(/unavailable|no controllable device|device.*not found/i.test(s))return 'Spotify is not active on the selected device';
 if(/premium|403/i.test(s))return 'Spotify Premium is required for this playback control';
 if(/429|rate/i.test(s))return 'Spotify is busy — try again in a moment';
 if(/401|reconnect/i.test(s))return 'Spotify needs to reconnect';
 if(/failed to fetch|network/i.test(s))return 'Network connection problem';
 return s
}
function toast(t){const m=$('msg');m.textContent=friendly(t);m.classList.add('show');clearTimeout(window._m);window._m=setTimeout(()=>m.classList.remove('show'),1800)}
function fmt(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function imgUrl(t){return t?.album?.images?.[0]?.url||t?.images?.[0]?.url||''}

function saveTokens(t){
  localStorage.setItem('spotify_access_token',t.access_token);
  if(t.refresh_token)localStorage.setItem('spotify_refresh_token',t.refresh_token);
  localStorage.setItem('spotify_expires_at',Date.now()+((t.expires_in||3600)-60)*1000)
}
async function refreshToken(){
  const rt=localStorage.getItem('spotify_refresh_token');
  const cid=localStorage.getItem('spotify_client_id');
  if(!rt||!cid)throw Error('Reconnect Spotify');
  const body=new URLSearchParams({client_id:cid,grant_type:'refresh_token',refresh_token:rt});
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const text=await r.text();
  if(!r.ok)throw Error('Reconnect Spotify');
  const data=text?JSON.parse(text):{};
  saveTokens(data)
}
async function token(){
  if(Date.now()>Number(localStorage.getItem('spotify_expires_at')||0))await refreshToken();
  return localStorage.getItem('spotify_access_token')
}
async function api(path,opt={}){
  const tk=await token();
  if(!tk)throw Error('Spotify is not connected');
  const headers={...(opt.headers||{}),Authorization:'Bearer '+tk};
  let r=await fetch(API+path,{...opt,headers});
  if(r.status===401){
    await refreshToken();
    const tk2=await token();
    r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tk2}});
  }
  const text=await r.text();
  if(!r.ok){
    let msg='Spotify '+r.status;
    if(text){try{const j=JSON.parse(text);msg=j?.error?.message||j?.error_description||msg}catch{}}
    throw Error(msg)
  }
  if(!text.trim())return null;
  const ct=(r.headers.get('content-type')||'').toLowerCase();
  if(ct.includes('application/json')){try{return JSON.parse(text)}catch{return null}}
  try{return JSON.parse(text)}catch{return text}
}

const categories=[
{name:"METAL",q:"genre:metal",sub:"Metal"},
{name:"ROCK",q:"genre:rock",sub:"Rock"},
{name:"ALTERNATIVE",q:"genre:alternative",sub:"Alternative"},
{name:"90s METAL",q:"metal year:1990-1999",sub:"90s"},
{name:"CLASSIC ROCK",q:"classic rock",sub:"Classic"},
{name:"90s ROCK",q:"rock year:1990-1999",sub:"90s"},
{name:"HEAVY",q:"heavy metal",sub:"Heavy Metal"},
{name:"DISCOVER",q:"hard rock metal",sub:"Mix"}];

function renderCategories(){
 $('browseGrid').innerHTML=categories.map((c,i)=>`
 <button class="card" data-q="${esc(c.q)}" data-title="${esc(c.name)}" data-cat="${i}">
   <div class="mosaic-fallback"></div>
   <div class="mosaic" id="mosaic-${i}"></div>
   <div class="shade"></div>
   <div class="meta"><b>${esc(c.name)}</b><span>${esc(c.sub)}</span></div>
 </button>`).join('');
 $('browseGrid').querySelectorAll('.card').forEach(b=>b.onclick=()=>searchTracks(b.dataset.q,b.dataset.title,$('resultsList')));
 hydrateCategoryArt()
}
async function hydrateCategoryArt(){
 for(let i=0;i<categories.length;i++){
   try{
     const d=await api('/search?type=track&limit=6&q='+encodeURIComponent(categories[i].q));
     const urls=[],seen=new Set();
     for(const t of (d?.tracks?.items||[])){
       const u=imgUrl(t); if(u&&!seen.has(u)){seen.add(u);urls.push(u)}
       if(urls.length===4)break
     }
     const box=$('mosaic-'+i);
     if(box&&urls.length){
       while(urls.length<4)urls.push(urls[urls.length-1]);
       box.innerHTML=urls.slice(0,4).map(u=>`<img src="${esc(u)}" alt="">`).join('')
     }
   }catch{}
   await new Promise(r=>setTimeout(r,120))
 }
}
const trackCache=new Map();
let pickedUri='';

function renderTracks(list,target){
 list.forEach(t=>{if(t?.uri)trackCache.set(t.uri,t)});
 target.innerHTML=list.map(t=>`<button class="row" data-uri="${esc(t.uri)}">
 ${imgUrl(t)?`<img src="${esc(imgUrl(t))}" alt="">`:'<div></div>'}
 <div class="song"><b>${esc(t.name)}</b><span>${esc((t.artists||[]).map(a=>a.name).join(', '))}</span></div>
 <span class="dur">${fmt(t.duration_ms)}</span></button>`).join('');
 target.querySelectorAll('.row').forEach(b=>b.onclick=()=>chooseTrack(b.dataset.uri))
}

function chooseTrack(uri){
 const t=trackCache.get(uri); if(!t)return;
 pickedUri=uri;
 $('trackPickTitle').textContent=t.name||'Track';
 $('trackPickArtist').textContent=(t.artists||[]).map(a=>a.name).join(', ');
 const art=imgUrl(t); $('trackPickArt').style.backgroundImage=art?`url("${art}")`:'none';
 $('trackPickOverlay').classList.add('show')
}
function closeTrackPick(){$('trackPickOverlay').classList.remove('show')}
$('trackPickCancel').onclick=closeTrackPick;
$('trackPickOverlay').onclick=e=>{if(e.target===$('trackPickOverlay'))closeTrackPick()};

async function fetchSearchPages(q,pages=5){
 const all=[],seen=new Set();
 for(let page=0;page<pages;page++){
   const offset=page*10;
   const d=await api('/search?type=track&limit=10&offset='+offset+'&q='+encodeURIComponent(q));
   const items=d?.tracks?.items||[];
   for(const t of items){if(t?.uri&&!seen.has(t.uri)){seen.add(t.uri);all.push(t)}}
   if(items.length<10)break;
 }
 return all
}
async function searchTracks(q,title,target){
 $('resultsTitle').textContent=title;showScreen('results');
 target.innerHTML='<div class="row"><div></div><div class="song"><b>Loading up to 50 tracks…</b></div><div></div></div>';
 try{const tracks=await fetchSearchPages(q,5);renderTracks(tracks,target);$('resultsTitle').textContent=title+' · '+tracks.length+' TRACKS'}catch(e){toast(e.message)}
}

let targetDevice=localStorage.getItem('spotify_device_id')||'';
async function loadDevices(){
 const d=await api('/me/player/devices');
 const devices=(d?.devices||[]).filter(x=>!x.is_restricted);
 const sel=$('deviceSelect');
 sel.innerHTML=devices.length?devices.map(x=>`<option value="${esc(x.id||'')}" ${((x.id===targetDevice)||(!targetDevice&&x.is_active))?'selected':''}>${esc(x.name)}${x.is_active?' • active':''}</option>`).join(''):'<option value="">No controllable device found</option>';
 if(!targetDevice){const active=devices.find(x=>x.is_active)||devices[0];if(active?.id){targetDevice=active.id;localStorage.setItem('spotify_device_id',targetDevice)}}
}
$('deviceSelect').onchange=()=>{targetDevice=$('deviceSelect').value;localStorage.setItem('spotify_device_id',targetDevice);toast('Playback device selected')};
$('reloadDevices').onclick=()=>loadDevices().catch(e=>toast(e.message));

async function ensureDevice(){
 const d=await api('/me/player/devices');
 const devices=(d?.devices||[]).filter(x=>!x.is_restricted);
 if(!targetDevice){const a=devices.find(x=>x.is_active)||devices[0];if(a?.id){targetDevice=a.id;localStorage.setItem('spotify_device_id',targetDevice)}}
 if(!targetDevice)throw Error('Open Spotify on the PRITOM, play a track once, then refresh devices');
 const dev=devices.find(x=>x.id===targetDevice);
 if(!dev)throw Error('Selected Spotify device is unavailable');
 if(!dev.is_active)await api('/me/player',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_ids:[targetDevice],play:false})})
}
async function playUri(uri){
 try{
  await ensureDevice();
  await api('/me/player/play?device_id='+encodeURIComponent(targetDevice),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({uris:[uri]})});
  setTimeout(refreshPlayer,450);showScreen('player')
 }catch(e){toast(e.message);openDrawer()}
}

async function addToQueue(uri){
 try{
  await ensureDevice();
  const qs='?uri='+encodeURIComponent(uri)+(targetDevice?'&device_id='+encodeURIComponent(targetDevice):'');
  await api('/me/player/queue'+qs,{method:'POST'});
  closeTrackPick();
  toast('Added to queue');
  refreshQueueCount().catch(()=>{})
 }catch(e){toast(e.message);openDrawer()}
}
$('playNowBtn').onclick=()=>{if(!pickedUri)return;const uri=pickedUri;closeTrackPick();playUri(uri)};
$('addQueueBtn').onclick=()=>{if(!pickedUri)return;addToQueue(pickedUri)};

async function refreshPlayer(){
 const s=await api('/me/player');
 if(!s||!s.item){$('miniTitle').textContent='Nothing playing';$('miniArtist').textContent='Spotify';$('miniAlbum').textContent='—';$('miniPlay').textContent='▶';$('bigPlay').textContent='▶';$('nowProgress').style.width='0%';return}
 const t=s.item,art=imgUrl(t),artists=(t.artists||[]).map(a=>a.name).join(', ');
 $('miniTitle').textContent=t.name;$('miniArtist').textContent=artists;$('miniAlbum').textContent=t.album?.name||'';
 $('playerTitle').textContent=t.name;$('playerArtist').textContent=artists;$('playerAlbum').textContent=t.album?.name||'';
 $('miniArt').style.backgroundImage=art?`url("${art}")`:'none';$('cover').style.backgroundImage=art?`url("${art}")`:'none';
 $('miniPlay').textContent=s.is_playing?'Ⅱ':'▶';$('bigPlay').textContent=s.is_playing?'Ⅱ':'▶';
 $('curTime').textContent=fmt(s.progress_ms);$('durTime').textContent=fmt(t.duration_ms);$('seekSlider').value=t.duration_ms?Math.round((s.progress_ms/t.duration_ms)*1000):0;$('nowProgress').style.width=t.duration_ms?Math.min(100,(s.progress_ms/t.duration_ms)*100)+'%':'0%';
 if(s.device?.volume_percent!=null){$('volumeSlider').value=s.device.volume_percent;$('volText').textContent=s.device.volume_percent+'%'}
}
async function togglePlay(){
 await ensureDevice();
 const s=await api('/me/player');
 await api(s?.is_playing?'/me/player/pause':'/me/player/play',{method:'PUT'});
 setTimeout(refreshPlayer,250)
}
$('miniPlay').onclick=e=>{e.stopPropagation();togglePlay().catch(e=>toast(e.message))};
$('bigPlay').onclick=()=>togglePlay().catch(e=>toast(e.message));
async function command(c){await ensureDevice();await api(c==='prev'?'/me/player/previous':'/me/player/next',{method:'POST'});setTimeout(refreshPlayer,300)}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=e=>{e.stopPropagation();command(b.dataset.cmd).catch(e=>toast(e.message))});
$('refreshPlayer').onclick=()=>refreshPlayer().catch(e=>toast(e.message));

let vt;
$('volumeSlider').oninput=()=>{$('volText').textContent=$('volumeSlider').value+'%';clearTimeout(vt);vt=setTimeout(()=>api('/me/player/volume?volume_percent='+$('volumeSlider').value+(targetDevice?'&device_id='+encodeURIComponent(targetDevice):''),{method:'PUT'}).catch(e=>toast(e.message)),180)};
$('seekSlider').onchange=async()=>{const s=await api('/me/player');if(!s?.item)return;const pos=Math.round(($('seekSlider').value/1000)*s.item.duration_ms);await api('/me/player/seek?position_ms='+pos,{method:'PUT'});refreshPlayer()};
$('shuffleBtn').onclick=async()=>{const s=await api('/me/player');await api('/me/player/shuffle?state='+(!s.shuffle_state),{method:'PUT'});toast('Shuffle '+(!s.shuffle_state?'on':'off'))};
$('repeatBtn').onclick=async()=>{const s=await api('/me/player');const n=s.repeat_state==='off'?'context':'off';await api('/me/player/repeat?state='+n,{method:'PUT'});toast('Repeat '+n)};
async function refreshQueueCount(){
 try{
  const d=await api('/me/player/queue');
  const n=(d?.queue||[]).length;
  $('queueCount').textContent='QUEUE '+n;
  return d
 }catch{return null}
}
async function openQueue(){
 showScreen('queue');
 try{
  const d=await refreshQueueCount() || await api('/me/player/queue');
  const q=(d?.queue||[]).slice(0,30);
  $('queueList').innerHTML=q.map(t=>`<div class="row">
   ${imgUrl(t)?`<img src="${esc(imgUrl(t))}" alt="">`:'<div></div>'}
   <div class="song"><b>${esc(t.name)}</b><span>${esc((t.artists||[]).map(a=>a.name).join(', '))}</span></div>
   <span class="dur">${fmt(t.duration_ms)}</span></div>`).join('') || '<div class="row"><div></div><div class="song"><b>Queue is empty</b></div><div></div></div>'
 }catch(e){toast(e.message)}
}
$('queueBtn').onclick=openQueue;

let st;
$('searchInput').oninput=()=>{clearTimeout(st);const q=$('searchInput').value.trim();if(q.length<2){$('searchResults').innerHTML='';return}
st=setTimeout(async()=>{try{const tracks=await fetchSearchPages(q,2);renderTracks(tracks,$('searchResults'))}catch(e){toast(e.message)}},300)};
$('favouritesBtn').onclick=async()=>{showScreen('results');$('resultsTitle').textContent='FAVOURITES';try{const d=await api('/me/tracks?limit=50');renderTracks((d?.items||[]).map(x=>x.track||x.item).filter(Boolean),$('resultsList'))}catch(e){toast(e.message)}};
$('recentBtn').onclick=async()=>{showScreen('results');$('resultsTitle').textContent='RECENTLY PLAYED';try{const d=await api('/me/player/recently-played?limit=50');renderTracks((d?.items||[]).map(x=>x.track).filter(Boolean),$('resultsList'))}catch(e){toast(e.message)}};

function openDrawer(){$('drawer').classList.add('open');$('overlay').classList.add('show');loadDevices().catch(e=>toast(e.message))}
function closeDrawer(){$('drawer').classList.remove('open');$('overlay').classList.remove('show')}
$('menuBtn').onclick=openDrawer;$('overlay').onclick=closeDrawer;
$('drawerHome').onclick=()=>{closeDrawer();showScreen('home')};
$('drawerNow').onclick=()=>{closeDrawer();showScreen('player')};
$('drawerQueue').onclick=()=>{closeDrawer();openQueue()};
$('settingsToggle').onclick=()=>{$('settingsPanel').classList.toggle('open')};
$('logoutBtn').onclick=()=>{['spotify_access_token','spotify_refresh_token','spotify_expires_at','spotify_device_id'].forEach(k=>localStorage.removeItem(k));location.reload()};
$('fullScreenBtn').onclick=async()=>{try{await document.documentElement.requestFullscreen();try{await screen.orientation.lock('landscape')}catch{}closeDrawer()}catch(e){toast('Use Chrome menu → Add to Home screen / Install app')}};

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').style.display='block'});
$('installBtn').onclick=async()=>{if(!deferredInstall){toast('Use Chrome menu → Add to Home screen / Install app');return}deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('installBtn').style.display='none'};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');


function updateClock(){
 const d=new Date();
 $('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}
updateClock();setInterval(updateClock,30000);

let idleHomeTimer,dimTimer;
function resetIdle(){
 $('dimOverlay').classList.remove('on');
 clearTimeout(idleHomeTimer);clearTimeout(dimTimer);
 idleHomeTimer=setTimeout(()=>{
   closeTrackPick();closeDrawer();
   if(document.activeElement)$('searchInput')?.blur();
   showScreen('home')
 },90000);
 dimTimer=setTimeout(()=>$('dimOverlay').classList.add('on'),180000);
 requestWakeLock()
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
resetIdle();

let wakeLock=null;
async function requestWakeLock(){
 if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||wakeLock)return;
 try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});
requestWakeLock();

renderCategories();
loadDevices().catch(()=>{});
refreshPlayer().catch(()=>{});
setInterval(()=>refreshPlayer().catch(()=>{}),5000);
refreshQueueCount().catch(()=>{});setInterval(()=>refreshQueueCount().catch(()=>{}),30000);
</script>
</body>
</html>
